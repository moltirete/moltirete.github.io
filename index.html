<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moltirete.github.io</title>
  <meta name="description" content="Welcome to my GitHub Pages site.">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji"; margin: 0; min-height: 100svh; display: grid; place-items: center; position: relative; overflow-x: hidden; }
    main { text-align: center; padding: 2rem; }
    h1 { font-weight: 700; letter-spacing: 0.3px; margin: 0 0 0.5rem; }
    p { margin: 0.25rem 0; opacity: 0.8; }
    a { color: inherit; }

    /* Password gate overlay */
    .gate-overlay { position: fixed; inset: 0; display: grid; place-items: center; backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%); background: color-mix(in oklab, canvas 60%, black 25%); z-index: 10; padding: 1rem; }
    .gate-card { width: 100%; max-width: 420px; border-radius: 16px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.15); background: color-mix(in oklab, canvas 92%, white 12%); border: 1px solid color-mix(in oklab, canvastext 12%, transparent); }
    .gate-title { margin: 0 0 0.25rem; font-size: 1.35rem; font-weight: 700; letter-spacing: .2px; }
    .gate-sub { margin: 0 0 1.25rem; opacity: .75; font-size: .95rem; }
    .gate-form { display: grid; gap: 12px; }
    .gate-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid color-mix(in oklab, canvastext 14%, transparent); background: color-mix(in oklab, canvas 96%, white 8%); color: inherit; outline: none; font-size: 1rem; transition: border-color .15s ease, box-shadow .15s ease; }
    .gate-input:focus { border-color: color-mix(in oklab, highlight 60%, canvastext 20%); box-shadow: 0 0 0 4px color-mix(in oklab, highlight 20%, transparent); }
    .gate-button { appearance: none; border: 0; border-radius: 12px; padding: 12px 16px; font-size: 1rem; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, color-mix(in oklab, highlight 70%, canvas 0%), color-mix(in oklab, highlight 50%, canvas 0%)); color: white; transition: transform .05s ease, filter .15s ease, box-shadow .15s ease; box-shadow: 0 8px 20px rgba(0,0,0,.18); }
    .gate-button:hover { filter: brightness(1.05); }
    .gate-button:active { transform: translateY(1px); }
    .gate-error { height: 1.25rem; font-size: .9rem; color: color-mix(in oklab, crimson 85%, canvastext 0%); opacity: 0; transition: opacity .15s ease; }
    .gate-error.show { opacity: 1; }
    .gate-footer { margin-top: 10px; opacity: .6; font-size: .85rem; text-align: center; }
    @media (max-width: 480px) { .gate-card { padding: 22px; border-radius: 14px; } }
  </style>
</head>
<body>
  <div id="gate" class="gate-overlay" hidden>
    <div class="gate-card" role="dialog" aria-labelledby="gate-title" aria-modal="true">
      <h2 id="gate-title" class="gate-title">Development access</h2>
      <p class="gate-sub">Enter the access code to view the site.</p>
      <form class="gate-form" id="gate-form" autocomplete="off">
        <input id="gate-input" class="gate-input" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Access code" aria-label="Access code" />
        <div id="gate-error" class="gate-error" role="alert"></div>
        <button type="submit" class="gate-button">Unlock</button>
      </form>
      <div class="gate-footer">Tip: This site is in dev mode.</div>
    </div>
  </div>
  <main>
    <h1>moltirete.github.io</h1>
    <p>Deployed via GitHub Pages.</p>
    <p><a href="https://github.com/moltirete/moltirete.github.io">View the repository</a></p>
  </main>
  <noscript>
    <style>
      #gate[hidden] { display: grid !important; }
    </style>
    You need JavaScript enabled to access this site.
  </noscript>
  <script>
    (function () {
      var STORAGE_KEY = "devUnlock";
      var PASSWORD = "858";
      var gate = document.getElementById("gate");
      var form = document.getElementById("gate-form");
      var input = document.getElementById("gate-input");
      var error = document.getElementById("gate-error");

      function revealSite() {
        if (!gate) return;
        gate.hidden = true;
        gate.style.display = "none";
      }

      function showGate() {
        if (!gate) return;
        gate.hidden = false;
        gate.style.display = "grid";
        setTimeout(function(){ try { input && input.focus(); } catch (_) {} }, 0);
      }

      try {
        if (localStorage.getItem(STORAGE_KEY) === "true") {
          revealSite();
          return;
        }
      } catch (_) {}

      showGate();

      if (form) {
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          var value = (input && input.value || "").trim();
          if (value === PASSWORD) {
            try { localStorage.setItem(STORAGE_KEY, "true"); } catch (_) {}
            revealSite();
          } else {
            if (error) { error.textContent = "Incorrect code. Please try again."; error.classList.add("show"); }
          }
        });
      }
    })();
  </script>
</body>
</html>
