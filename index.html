<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moltirete.github.io</title>
  <meta name="description" content="Welcome to my GitHub Pages site.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="gate" class="gate-overlay" hidden>
    <div class="gate-card" role="dialog" aria-labelledby="gate-title" aria-modal="true">
      <h2 id="gate-title" class="gate-title">Development access</h2>
      <p class="gate-sub">Enter the access code to view the site.</p>
      <form class="gate-form" id="gate-form" autocomplete="off">
        <input id="gate-input" class="gate-input" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Access code" aria-label="Access code" />
        <div id="gate-error" class="gate-error" role="alert"></div>
        <button type="submit" class="gate-button">Unlock</button>
      </form>
      <div class="gate-footer">Tip: This site is in dev mode.</div>
    </div>
  </div>
  <main class="hero">
    <div class="hero-inner">
      <h1>moltirete.github.io</h1>
      <p>Deployed via GitHub Pages.</p>
      <p><a class="link" href="https://github.com/moltirete/moltirete.github.io">View the repository</a></p>
    </div>
  </main>
  <noscript>
    <style>
      #gate[hidden] { display: grid !important; }
    </style>
    You need JavaScript enabled to access this site.
  </noscript>
  <script src="gate.js" defer></script>
</body>
</html>
